<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI教育資訊快報</title>
<meta name="description" content="數位科技轉化大學師培課程培訓計畫：給大學師培教授的 AI 教育新知，持續更新。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="reader.css">
<style>
:root {
  --paper: #FFFFFF;
  --ground: #EEF1F6;
  --ink: #1F3864;
  --title: #17365D;
  --mute: #5B7089;
  --line: #D5DDEA;
  --zebra: #F3F6FB;
  --on-fill: #FFFFFF;
  --brand: #2F6DB5;
  --shadow: 0 10px 30px rgba(23, 54, 93, .09);
  --shadow-hi: 0 16px 40px rgba(23, 54, 93, .16);
  --c: var(--brand);
  --c-acc: color-mix(in srgb, var(--c) 78%, #000);
  --c-soft: color-mix(in srgb, var(--c) 12%, var(--paper));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #172131; --ground: #0C131D; --ink: #D9E3F1; --title: #F1F5FB;
    --mute: #A5B5CA; --line: #2D3C53; --zebra: #1D293B; --on-fill: #0C131D;
    --brand: #8DB6EA;
    --shadow: 0 10px 30px rgba(0,0,0,.4); --shadow-hi: 0 16px 40px rgba(0,0,0,.55);
    --c-acc: color-mix(in srgb, var(--c) 45%, #fff);
    --c-soft: color-mix(in srgb, var(--c) 22%, var(--paper));
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #172131; --ground: #0C131D; --ink: #D9E3F1; --title: #F1F5FB;
  --mute: #A5B5CA; --line: #2D3C53; --zebra: #1D293B; --on-fill: #0C131D;
  --brand: #8DB6EA;
  --shadow: 0 10px 30px rgba(0,0,0,.4); --shadow-hi: 0 16px 40px rgba(0,0,0,.55);
  --c-acc: color-mix(in srgb, var(--c) 45%, #fff);
  --c-soft: color-mix(in srgb, var(--c) 22%, var(--paper));
  color-scheme: dark;
}
[style*="--c:"] {
  --c-acc: color-mix(in srgb, var(--c) 78%, #000);
  --c-soft: color-mix(in srgb, var(--c) 12%, var(--paper));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [style*="--c:"] {
    --c-acc: color-mix(in srgb, var(--c) 45%, #fff);
    --c-soft: color-mix(in srgb, var(--c) 22%, var(--paper));
  }
}
:root[data-theme="dark"] [style*="--c:"] {
  --c-acc: color-mix(in srgb, var(--c) 45%, #fff);
  --c-soft: color-mix(in srgb, var(--c) 22%, var(--paper));
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  font-size: 18px; line-height: 1.75;
  background: var(--ground); color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: var(--c-acc); }
button { font: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 640px) { .wrap { padding: 0 16px; } body { font-size: 17px; } }

/* ===== 頂部列 ===== */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 14px; height: 66px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--title); min-width: 0; margin-right: auto; }
.brand img { height: 46px; width: auto; border-radius: 8px; background: #fff; }
.brand b { font-weight: 900; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { display: block; font-size: 12.5px; color: var(--mute); font-weight: 500; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .txt { min-width: 0; line-height: 1.3; }
.navlinks { display: flex; gap: 4px; }
.navlinks a, .iconbtn {
  text-decoration: none; color: var(--ink); font-weight: 500; font-size: 15.5px;
  padding: 7px 12px; border-radius: 10px; border: 1px solid transparent; background: none; cursor: pointer; white-space: nowrap;
}
.navlinks a:hover, .iconbtn:hover { background: var(--zebra); }
.iconbtn { border-color: var(--line); }
@media (max-width: 760px) { .navlinks { display: none; } .brand small { display: none; } }

/* ===== 首頁大標 ===== */
.hero { position: relative; overflow: hidden; padding: 56px 0 40px; }
.hero::before {
  content: ""; position: absolute; right: -160px; top: -200px; width: 560px; height: 560px; border-radius: 50%;
  background: radial-gradient(circle at 35% 65%, color-mix(in srgb, var(--brand) 14%, transparent) 0 58%, transparent 59%),
              radial-gradient(circle, color-mix(in srgb, var(--brand) 26%, transparent) 0 2px, transparent 3px) 0 0 / 26px 26px;
  pointer-events: none;
}
.hero .kick { display: inline-flex; gap: 8px; align-items: center; background: color-mix(in srgb, var(--brand) 13%, var(--paper)); color: var(--brand); font-weight: 700; font-size: 15px; padding: 5px 14px; border-radius: 999px; letter-spacing: .04em; }
.hero h1 { font-size: clamp(38px, 6vw, 64px); line-height: 1.15; margin: 16px 0 10px; color: var(--title); font-weight: 900; letter-spacing: .02em; }
.hero p.lead { font-size: clamp(18px, 2.2vw, 22px); color: var(--mute); margin: 0 0 22px; max-width: 760px; }
.hero .stats { display: flex; flex-wrap: wrap; gap: 10px; }
.hero .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 8px 16px; font-size: 15px; color: var(--mute); box-shadow: var(--shadow); }
.hero .stat b { color: var(--title); font-size: 20px; margin-right: 4px; font-variant-numeric: tabular-nums; }
.hero .deco { position: absolute; right: 7%; bottom: 26px; font-size: 92px; transform: rotate(-8deg); filter: drop-shadow(0 8px 14px rgba(0,0,0,.12)); pointer-events: none; }
@media (max-width: 760px) { .hero .deco { display: none; } }

/* ===== 區塊標題 ===== */
section.block { padding: 26px 0 30px; scroll-margin-top: 80px; }
.sec-h { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 0 0 18px; }
.sec-h h2 { font-size: clamp(26px, 3.4vw, 34px); margin: 0; color: var(--title); font-weight: 900; position: relative; }
.sec-h h2::after { content: ""; display: block; width: 56px; height: 5px; border-radius: 3px; background: var(--brand); margin-top: 6px; }
.sec-h .sub { color: var(--mute); font-size: 16px; }

/* ===== 本期焦點 ===== */
.issue-banner {
  background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); border-top: 10px solid var(--brand);
  padding: 26px 30px; position: relative; overflow: hidden;
}
.issue-banner .meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--mute); font-size: 15.5px; }
.issue-banner .no { background: var(--brand); color: var(--on-fill); font-weight: 900; padding: 3px 14px; border-radius: 999px; }
.issue-banner h3 { font-size: clamp(24px, 3vw, 30px); margin: 10px 0 6px; color: var(--title); }
.issue-banner .intro { color: var(--ink); margin: 0 0 16px; max-width: 900px; }
@media (max-width: 640px) { .issue-banner { padding: 20px 14px; } }
.feat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; margin-top: 8px; }

/* ===== 卡片 ===== */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 18px; }
.card {
  background: var(--paper); border-radius: 18px; box-shadow: var(--shadow);
  border-top: 7px solid var(--c); padding: 20px 22px 18px;
  display: flex; flex-direction: column; gap: 10px; position: relative;
  transition: transform .2s ease, box-shadow .2s ease; cursor: pointer;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hi); }
.card:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
.card .top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; color: var(--mute); }
.tag { display: inline-flex; align-items: center; gap: 5px; background: var(--c-soft); color: var(--c-acc); font-weight: 700; font-size: 13.5px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; text-decoration: none; border: 0; cursor: pointer; }
.new { background: #B23A2E; color: #fff; font-weight: 900; font-size: 12px; padding: 1px 8px; border-radius: 6px; letter-spacing: .06em; }
.card h3 { margin: 0; font-size: 21px; line-height: 1.45; color: var(--title); }
.card .tldr-label { font-size: 13.5px; font-weight: 700; color: var(--c-acc); letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
.card ol { margin: 0; padding-left: 1.3em; font-size: 16.5px; line-height: 1.7; }
.card ol li { margin: 3px 0; }
.card ol li::marker { color: var(--c); font-weight: 900; }
.take { background: var(--c-soft); border-radius: 12px; padding: 10px 14px; font-size: 16px; line-height: 1.65; }
.take b { color: var(--c-acc); display: block; font-size: 13.5px; letter-spacing: .05em; margin-bottom: 2px; }
.card .more { margin-top: auto; padding-top: 4px; font-weight: 700; color: var(--c-acc); font-size: 15.5px; }
.card.compact ol, .card.compact .take, .card.compact .tldr-label { display: none; }
.cta { margin-top: auto; padding-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.cta a { text-decoration: none; border-radius: 12px; padding: 8px 16px; font-weight: 700; font-size: 16px; }
.cta .go { background: var(--c); color: #fff; }
.cta .go:hover { filter: brightness(1.08); }
.cta .alt { color: var(--c-acc); border: 1px solid var(--line); background: var(--paper); font-weight: 500; }
.cta .alt:hover { border-color: var(--c); }
.read { background: color-mix(in srgb, #3A7D34 14%, var(--paper)); color: #3A7D34; font-weight: 700; font-size: 12.5px; padding: 1px 8px; border-radius: 6px; }
.playbtn { display: inline-flex; align-items: center; gap: 8px; background: var(--brand); color: var(--on-fill); text-decoration: none; font-weight: 900; font-size: 18px; padding: 12px 22px; border-radius: 14px; box-shadow: var(--shadow); }
.playbtn:hover { filter: brightness(1.08); }
.playbtn small { font-weight: 500; opacity: .9; font-size: 14.5px; }
.hero .cta-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0 0 22px; }

/* ===== 主題地圖 ===== */
.topic-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 14px; }
.topic {
  background: var(--paper); border: 2px solid transparent; border-radius: 18px; padding: 16px 18px; box-shadow: var(--shadow);
  cursor: pointer; text-align: left; color: var(--ink); display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center;
  transition: border-color .2s, transform .2s;
}
.topic:hover { transform: translateY(-2px); border-color: var(--c); }
.topic.on { border-color: var(--c); background: var(--c-soft); }
.topic .em { font-size: 34px; grid-row: span 2; }
.topic b { font-size: 18px; color: var(--title); }
.topic .cnt { grid-row: span 2; font-weight: 900; font-size: 26px; color: var(--c-acc); font-variant-numeric: tabular-nums; }
.topic .d { font-size: 14px; color: var(--mute); line-height: 1.5; }

/* ===== 搜尋與篩選 ===== */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.search { flex: 1 1 320px; display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; box-shadow: var(--shadow); }
.search:focus-within { border-color: var(--brand); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; font-size: 17px; padding: 12px 0; }
select.sel { font: inherit; font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; box-shadow: var(--shadow); }
.viewtoggle { display: inline-flex; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--paper); box-shadow: var(--shadow); }
.viewtoggle button { border: 0; background: none; color: var(--ink); padding: 11px 14px; cursor: pointer; font-size: 15px; }
.viewtoggle button.on { background: var(--brand); color: var(--on-fill); font-weight: 700; }
.active-filter { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: -6px 0 14px; color: var(--mute); font-size: 15.5px; }
.clear { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 2px 12px; cursor: pointer; font-size: 14px; }
.empty { background: var(--paper); border-radius: 18px; padding: 30px; text-align: center; color: var(--mute); box-shadow: var(--shadow); }
mark { background: color-mix(in srgb, #F0B35A 45%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

/* ===== 清爽版首頁 ===== */
.hero .lead { margin-bottom: 18px; }
.ghostbtn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); background: var(--paper); border: 1px solid var(--line); font-weight: 700; font-size: 17px; padding: 11px 20px; border-radius: 14px; }
.ghostbtn:hover { border-color: var(--brand); color: var(--brand); }
.ghostbtn.sm { font-size: 14.5px; padding: 6px 12px; border-radius: 10px; }
.hero .tiny { color: var(--mute); font-size: 15px; margin: 0; }
.btiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .btiles { grid-template-columns: 1fr; } }
.btile { display: flex; flex-direction: column; text-decoration: none; color: var(--ink); background: var(--paper); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); transition: transform .2s, box-shadow .2s; }
.btile:hover { transform: translateY(-4px); box-shadow: var(--shadow-hi); }
.btile .band { position: relative; height: 128px; background: radial-gradient(circle, color-mix(in srgb, var(--c) 30%, transparent) 0 2px, transparent 3px) 0 0 / 20px 20px, var(--c-soft); border-top: 8px solid var(--c); display: grid; place-items: center; }
.btile .band .em { font-size: 64px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.15)); transform: rotate(-6deg); }
.btile .band .new, .btile .band .read { position: absolute; left: 14px; top: 12px; }
.btile .tb { padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.btile .tname { font-size: 14px; font-weight: 700; color: var(--c-acc); letter-spacing: .04em; }
.btile h3 { margin: 0; font-size: 20px; line-height: 1.45; color: var(--title); flex: 1; }
.btile .go { font-weight: 700; color: var(--c-acc); font-size: 15.5px; margin-top: 6px; }
.searchbtn { margin-left: auto; align-self: center; }
.searchrow { margin: -4px 0 14px; display: flex; }
.searchrow[hidden] { display: none; }
.chiprow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.tchip { font: inherit; font-size: 15px; font-weight: 500; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.tchip:hover { border-color: var(--c, var(--brand)); }
.tchip.on { background: var(--c, var(--brand)); border-color: var(--c, var(--brand)); color: #fff; font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.tile { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; background: var(--paper); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); border-left: 6px solid var(--c); cursor: pointer; transition: transform .15s, box-shadow .15s; }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-hi); }
.tile:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
.tile .em { width: 56px; height: 56px; border-radius: 14px; background: var(--c-soft); display: grid; place-items: center; font-size: 30px; }
.tile h3 { margin: 0; font-size: 17.5px; line-height: 1.45; color: var(--title); }
.tile .meta { font-size: 14px; color: var(--mute); margin-top: 2px; }
.tile .arrow { color: var(--c-acc); font-size: 16px; }
details.archive { background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); padding: 4px 18px; }
details.archive summary { cursor: pointer; font-weight: 700; color: var(--title); font-size: 18px; padding: 12px 0; }
.arow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.arow small { color: var(--mute); margin-left: 10px; font-size: 14px; }

/* ===== 歷期 ===== */
.timeline { position: relative; padding-left: 30px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 8px; bottom: 8px; width: 3px; background: var(--line); border-radius: 2px; }
.tl-item { position: relative; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 14px; }
.tl-item::before { content: ""; position: absolute; left: -28px; top: 22px; width: 16px; height: 16px; border-radius: 50%; background: var(--brand); border: 3px solid var(--paper); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 30%, transparent); }
.tl-item .h { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
.tl-item .h b { font-size: 19px; color: var(--title); }
.tl-item .h span { color: var(--mute); font-size: 15px; }
.tl-item ul { margin: 8px 0 4px; padding-left: 1.2em; }
.tl-item li a { text-decoration: none; font-weight: 500; }
.tl-item li a:hover { text-decoration: underline; }
.tl-item .legacy { font-size: 14px; color: var(--mute); }

/* ===== 文章頁 ===== */
.article { padding: 26px 0 50px; }
.crumb { font-size: 15px; color: var(--mute); margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.crumb a { color: var(--mute); }
.a-head { background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); border-top: 12px solid var(--c); padding: 28px 34px 26px; position: relative; overflow: hidden; }
.a-head::before {
  content: ""; position: absolute; right: -150px; top: -210px; width: 480px; height: 480px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 35% 65%, var(--c-soft) 0 58%, transparent 59%),
              radial-gradient(circle, color-mix(in srgb, var(--c) 22%, transparent) 0 2px, transparent 3px) 0 0 / 24px 24px;
}
.a-head > * { position: relative; }
.a-head .deco { position: absolute; right: 34px; top: 22px; font-size: 76px; transform: rotate(-8deg); filter: drop-shadow(0 8px 14px rgba(0,0,0,.12)); }
.a-head h1 { font-size: clamp(28px, 4vw, 42px); line-height: 1.3; margin: 12px 0 10px; color: var(--title); font-weight: 900; padding-right: 90px; }
.a-head .meta { color: var(--mute); font-size: 15.5px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
@media (max-width: 640px) { .a-head { padding: 22px 18px; } .a-head h1 { padding-right: 0; } .a-head .deco { display: none; } }

.quick { margin-top: 18px; display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
@media (max-width: 860px) { .quick { grid-template-columns: 1fr; } }
.quick .panel { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 24px; }
.quick .panel h2 { font-size: 18px; margin: 0 0 8px; color: var(--c-acc); letter-spacing: .04em; display: flex; gap: 8px; align-items: center; }
.quick ol { margin: 0; padding-left: 1.3em; }
.quick ol li { margin: 6px 0; }
.quick ol li::marker { color: var(--c); font-weight: 900; }
.quick .panel.take2 { background: var(--c-soft); }
.quick .panel.take2 p { margin: 0 0 14px; font-size: 18.5px; font-weight: 500; color: var(--title); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 8px 14px; font-size: 15.5px; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--c); color: var(--c-acc); }
.btn.primary { background: var(--c); border-color: var(--c); color: var(--on-fill); font-weight: 700; }
.btn.primary:hover { color: var(--on-fill); filter: brightness(1.08); }

.a-body { margin-top: 18px; background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); padding: 30px 40px 34px; }
@media (max-width: 640px) { .a-body { padding: 22px 18px; } }
.a-body > .label { display: inline-flex; gap: 8px; align-items: center; background: var(--c-soft); color: var(--c-acc); font-weight: 700; font-size: 14.5px; padding: 4px 12px; border-radius: 999px; letter-spacing: .05em; }
.a-body h2 { font-size: 25px; color: var(--title); margin: 34px 0 10px; padding-left: 14px; border-left: 6px solid var(--c); line-height: 1.4; }
.a-body h3 { font-size: 20px; color: var(--c-acc); margin: 24px 0 8px; }
.a-body p { margin: 10px 0; text-align: justify; text-justify: inter-ideograph; }
.a-body strong { color: var(--c-acc); }
.a-body blockquote { margin: 22px 0; padding: 16px 22px; border-left: 6px solid var(--c); background: var(--c-soft); border-radius: 0 14px 14px 0; font-size: 18.5px; color: var(--title); }
.a-body blockquote cite { display: block; text-align: right; font-style: normal; color: var(--mute); font-size: 15px; margin-top: 6px; }
.a-body ul.list { padding-left: 1.2em; }
.a-body ul.list li { margin: 8px 0; }
.a-body ul.list li::marker { color: var(--c); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 14px; margin: 14px 0; }
.mini { border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; background: var(--paper); position: relative; }
.mini .ic { font-size: 28px; line-height: 1; }
.mini b { display: block; font-size: 18px; color: var(--title); margin: 6px 0 4px; }
.mini div { font-size: 16.5px; line-height: 1.7; }

.steps { counter-reset: s; margin: 14px 0; display: grid; gap: 12px; }
.step { counter-increment: s; display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; background: var(--zebra); border-radius: 14px; padding: 14px 18px; }
.step::before { content: counter(s); width: 40px; height: 40px; border-radius: 50%; background: var(--c); color: var(--on-fill); font-weight: 900; font-size: 19px; display: grid; place-items: center; }
.step b { display: block; font-size: 18px; color: var(--title); margin-bottom: 2px; }
.step div { font-size: 16.5px; }

.tline { position: relative; padding-left: 28px; margin: 16px 0; }
.tline::before { content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 3px; background: var(--c-soft); }
.tline .ti { position: relative; margin-bottom: 18px; }
.tline .ti::before { content: ""; position: absolute; left: -26px; top: 7px; width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px var(--c-soft); }
.tline .y { display: inline-block; font-weight: 900; color: var(--on-fill); background: var(--c); border-radius: 8px; padding: 0 10px; font-size: 15px; }
.tline b { font-size: 18.5px; color: var(--title); margin-left: 8px; }
.tline div { margin-top: 6px; font-size: 16.5px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chips span { background: var(--c-soft); color: var(--c-acc); font-weight: 700; border-radius: 10px; padding: 6px 14px; font-size: 16px; }

.statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 14px 0; }
.statrow div { background: var(--c-soft); border-radius: 14px; padding: 12px 14px; text-align: center; }
.statrow b { display: block; font-size: 34px; font-weight: 900; color: var(--c-acc); line-height: 1.2; font-variant-numeric: tabular-nums; }
.statrow span { font-size: 15px; color: var(--mute); }

.ladder { display: grid; gap: 10px; margin: 14px 0; }
.rung { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: stretch; }
.rung .lv { border-radius: 12px; color: var(--on-fill); font-weight: 900; display: grid; place-items: center; text-align: center; padding: 8px; font-size: 16px; line-height: 1.3; background: var(--c); }
.rung .lv small { display: block; font-weight: 500; font-size: 12.5px; opacity: .9; }
.rung .dd { background: var(--zebra); border-radius: 12px; padding: 10px 14px; font-size: 16.5px; }
.rung .dd b { color: var(--title); display: block; }
@media (max-width: 560px) { .rung { grid-template-columns: 1fr; } }

.tbl-wrap { overflow-x: auto; margin: 14px 0; border-radius: 14px; border: 1px solid var(--line); }
table.cmp { border-collapse: collapse; width: 100%; font-size: 16.5px; }
table.cmp th { background: var(--c); color: var(--on-fill); text-align: left; padding: 10px 14px; }
table.cmp td { padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; }
table.cmp tr:nth-child(even) td { background: var(--zebra); }
.cmp-notes { font-size: 14.5px; color: var(--mute); margin: -6px 0 10px; }

.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 14px 0; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
.two .col { border-radius: 16px; padding: 16px 18px; }
.two .col.ok { background: color-mix(in srgb, #3A7D34 11%, var(--paper)); }
.two .col.no { background: color-mix(in srgb, #B23A2E 10%, var(--paper)); }
.two .col > b { font-size: 18.5px; color: var(--title); }
.two .it { margin-top: 10px; font-size: 16.5px; }
.two .it b { display: block; color: var(--title); }

details.appx { margin: 26px 0 6px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
details.appx > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; font-size: 18px; color: var(--title); background: var(--zebra); list-style: none; display: flex; gap: 10px; align-items: center; }
details.appx > summary::before { content: "▸"; color: var(--c); transition: transform .2s; }
details.appx[open] > summary::before { transform: rotate(90deg); }
details.appx .inner { padding: 6px 18px 18px; }
details.appx .note { font-size: 14.5px; color: var(--mute); text-align: left; }
details.appx h4 { margin: 20px 0 6px; font-size: 18px; color: var(--c-acc); }
details.appx h5 { margin: 12px 0 4px; font-size: 16px; color: var(--title); }
.ind { display: grid; grid-template-columns: 220px 1fr; border-top: 1px solid var(--line); font-size: 15.5px; }
.ind div { padding: 8px 10px; }
.ind div:first-child { font-weight: 700; color: var(--title); }
@media (max-width: 640px) { .ind { grid-template-columns: 1fr; } .ind div:first-child { padding-bottom: 0; } }

.related { margin: 22px 0 0; background: var(--zebra); border-radius: 14px; padding: 14px 18px; font-size: 16.5px; }

.refs { margin-top: 18px; }
.refs summary { cursor: pointer; font-weight: 700; color: var(--title); font-size: 18px; }
.refs ol { font-size: 15px; line-height: 1.65; padding-left: 1.4em; }
.refs li { margin: 8px 0; word-break: break-word; }
.refs a { word-break: break-all; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
.pager a { background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 18px; text-decoration: none; color: var(--ink); }
.pager a:hover { box-shadow: var(--shadow-hi); }
.pager small { color: var(--mute); display: block; font-size: 14px; }
.pager b { color: var(--title); font-size: 17px; }
.pager .nx { text-align: right; grid-column: 2; }
@media (max-width: 560px) { .pager { grid-template-columns: 1fr; } .pager .nx { grid-column: 1; } }

footer { padding: 30px 0 46px; color: var(--mute); font-size: 14.5px; text-align: center; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--title); color: var(--paper); padding: 10px 18px; border-radius: 12px; opacity: 0; transition: .25s; pointer-events: none; z-index: 50; font-size: 15.5px; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.totop { position: fixed; right: 18px; bottom: 18px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--brand); color: var(--on-fill); font-size: 22px; box-shadow: var(--shadow-hi); cursor: pointer; opacity: 0; pointer-events: none; transition: .25s; z-index: 40; }
.totop.show { opacity: 1; pointer-events: auto; }
@media print { .topbar, .totop, .pager, .actions, footer { display: none; } body { background: #fff; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#/" aria-label="回首頁">
      <img src="https://docs.google.com/drawings/d/e/2PACX-1vTRQ23kLgRB7Wyfe-gLnAJz1wyNVDk4XItM8d3Ve0wzemlJN6KpguGvU0q7wKBSvd8F6Cc4tcp86vcl/pub?w=1440&amp;h=1080" alt="計畫標誌" onerror="this.remove()">
      <span class="txt"><b>AI教育資訊快報</b><small>數位科技轉化大學師培課程培訓計畫</small></span>
    </a>
    <nav class="navlinks">
      <a href="#/" data-jump="latest">最新</a>
      <a href="#/" data-jump="all">全部新知</a>
      <a href="#/" data-jump="issues">快報合輯</a>
    </nav>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="切換深淺色">🌓</button>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">©陳佩英教授計畫團隊　·　數位科技轉化大學師培課程培訓計畫　·　內容持續更新</div>
</footer>
<button class="totop" id="totop" type="button" aria-label="回到最上方">↑</button>
<div class="toast" id="toast"></div>

<script src="data/articles.js"></script>
<script src="data/slides.js"></script>
<script src="data/posts.js"></script>
<script src="data/merge.js"></script>
<script src="reader.js"></script>
<script>
(function () {
  const TOPICS = window.KB_TOPICS || [];
  const ISSUES = (window.KB_ISSUES || []).slice().sort((a, b) => b.no - a.no);
  const ARTS = window.KB_ARTICLES || [];
  const T = Object.fromEntries(TOPICS.map(t => [t.key, t]));
  const I = Object.fromEntries(ISSUES.map(i => [i.no, i]));
  const latest = ISSUES[0];
  const app = document.getElementById("app");

  /* ---------- 小工具 ---------- */
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  const fmtDate = d => d.replace(/-/g, ".");
  const color = a => (T[a.topics[0]] || { color: "#2F6DB5" }).color;
  const deco = a => (T[a.topics[0]] || { emoji: "📰" }).emoji;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 1800);
  }

  /* 文章全文轉成可搜尋文字 */
  function flat(x) {
    if (x == null) return "";
    if (typeof x === "string") return x;
    if (Array.isArray(x)) return x.map(flat).join(" ");
    if (typeof x === "object") return Object.values(x).map(flat).join(" ");
    return "";
  }
  ARTS.forEach(a => {
    a._issue = I[a.issue] || null;
    a._date = a.date || (a._issue ? a._issue.date : "");
    a._text = [a.title, a.authors, flat(a.tldr), a.takeaway, flat(a.body), a.topics.map(k => T[k] ? T[k].name : "").join(" ")].join(" ").replace(/\*\*/g, "").toLowerCase();
  });
  const sorted = ARTS.slice().sort((a, b) => (b._date || "").localeCompare(a._date || "") || ARTS.indexOf(a) - ARTS.indexOf(b));
  const NEWEST = new Set(sorted.slice(0, 3).map(a => a.id));

  const R = window.KBReader;
  const PAGES = Object.fromEntries(ARTS.map(a => [a.id, R ? R.pages(a.id) : 0]));
  const mins = a => Math.max(2, Math.round((PAGES[a.id] || 6) * 0.35));
  let READ = R ? R.readSet() : new Set();

  /* ---------- 篩選狀態 ---------- */
  const state = { q: "", topic: "", issue: "", searchOpen: false };

  function hl(text, q) {
    const s = esc(text);
    if (!q) return s;
    const qq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return s.replace(new RegExp("(" + qq + ")", "gi"), "<mark>$1</mark>");
  }
  function tagHTML(k) {
    const t = T[k]; if (!t) return "";
    return `<span class="tag" style="--c:${t.color}">${t.emoji} ${esc(t.name)}</span>`;
  }

  /* 大卡：最新三則，只放圖示、主題、標題 */
  function bigTile(a) {
    const t = T[a.topics[0]] || {};
    return `<a class="btile" href="#/s/${a.id}" style="--c:${color(a)}">
      <div class="band"><span class="em">${deco(a)}</span>${READ.has(a.id) ? '<span class="read">✓ 已讀</span>' : '<span class="new">NEW</span>'}</div>
      <div class="tb">
        <span class="tname">${esc(t.name || "")}</span>
        <h3>${esc(a.title)}</h3>
        <span class="go">▶ 翻頁閱讀 · 約 ${mins(a)} 分鐘</span>
      </div></a>`;
  }
  /* 小卡：全部新知，只放標題與日期 */
  function tile(a, q) {
    return `<article class="tile" style="--c:${color(a)}" tabindex="0" data-id="${a.id}" role="link" aria-label="${esc(a.title)}">
      <span class="em">${deco(a)}</span>
      <div class="tt">
        <h3>${hl(a.title, q)}</h3>
        <div class="meta">${fmtDate(a._date)}${NEWEST.has(a.id) && !READ.has(a.id) ? ' · <span class="new">NEW</span>' : ""}${READ.has(a.id) ? ' · <span class="read">✓ 已讀</span>' : ""}</div>
      </div>
      <span class="arrow">▶</span>
    </article>`;
  }

  /* ---------- 首頁 ---------- */
  function renderHome(scrollTo) {
    const unread = ARTS.filter(a => !READ.has(a.id)).length;
    const first = sorted.find(a => !READ.has(a.id)) || sorted[0];
    const used = TOPICS.filter(t => ARTS.some(a => a.topics.includes(t.key)));
    app.innerHTML = `
    <section class="hero"><div class="wrap">
      <span class="kick">📰 給大學師培教授的 AI 教育新知</span>
      <h1>AI教育資訊快報</h1>
      <p class="lead">一則一則翻，每則約三分鐘。</p>
      <div class="cta-row">
        ${first ? `<a class="playbtn" href="#/s/${first.id}">▶ ${READ.size ? "從下一則未讀開始" : "從最新一則開始"}</a>` : ""}
        <a class="ghostbtn" href="#/" data-jump="all">瀏覽全部 ↓</a>
      </div>
      <p class="tiny">共 ${ARTS.length} 則 · 最近更新 ${fmtDate(sorted[0] ? sorted[0]._date : "")}${READ.size ? ` · 還有 ${unread} 則未讀` : ""}</p>
      <div class="deco">🧭</div>
    </div></section>

    <section class="block" id="latest"><div class="wrap">
      <div class="sec-h"><h2>最新</h2></div>
      <div class="btiles">${sorted.slice(0, 3).map(bigTile).join("")}</div>
    </div></section>

    <section class="block" id="all"><div class="wrap">
      <div class="sec-h"><h2>全部新知</h2>
        <button class="iconbtn searchbtn" id="searchBtn" type="button" aria-label="搜尋">🔍 搜尋</button></div>
      <div class="searchrow" id="searchRow" ${state.searchOpen || state.q ? "" : "hidden"}>
        <label class="search">🔍<input id="q" type="search" placeholder="輸入關鍵字，例如：評量、荷蘭、PISA" value="${esc(state.q)}" aria-label="搜尋"></label>
      </div>
      <div class="chiprow" role="group" aria-label="主題">
        <button type="button" class="tchip ${state.topic ? "" : "on"}" data-topic="">全部</button>
        ${used.map(t => `<button type="button" class="tchip ${state.topic === t.key ? "on" : ""}" style="--c:${t.color}" data-topic="${t.key}">${t.emoji} ${esc(t.name)}</button>`).join("")}
      </div>
      <div class="active-filter" id="af"></div>
      <div class="tiles" id="grid"></div>
    </div></section>

    ${ISSUES.length ? `<section class="block" id="issues"><div class="wrap">
      <details class="archive" ${state.issue ? "open" : ""}><summary>📚 舊版快報合輯（${ISSUES.length} 期）</summary>
        ${ISSUES.map(i => `<div class="arow"><span><b>第 ${i.no} 期</b>　${esc(i.title)}<small>${fmtDate(i.date)}</small></span><a class="ghostbtn sm" href="#/i/${i.no}">▶ 翻閱這一期</a></div>`).join("")}
      </details>
    </div></section>` : ""}`;

    renderGrid();
    bindHome();
    if (scrollTo) {
      const el = document.getElementById(scrollTo);
      if (el) requestAnimationFrame(() => el.scrollIntoView({ behavior: "smooth" }));
    } else window.scrollTo(0, 0);
  }

  function renderGrid() {
    const q = state.q.trim().toLowerCase();
    const list = sorted.filter(a =>
      (!state.topic || a.topics.includes(state.topic)) &&
      (!state.issue || String(a.issue) === String(state.issue)) &&
      (!q || a._text.includes(q)));
    document.getElementById("grid").innerHTML = list.length ? list.map(a => tile(a, state.q.trim())).join("")
      : `<div class="empty">找不到符合的新知，換個關鍵字試試。</div>`;
    const bits = [];
    if (state.issue) bits.push(`<span class="tag">第 ${state.issue} 期快報</span>`);
    if (q) bits.push(`<span class="tag">「${esc(state.q.trim())}」</span>`);
    const af = document.getElementById("af");
    af.innerHTML = (bits.length || state.topic) ? `${list.length} 則 ${bits.join("")}<button class="clear" id="clearF" type="button">清除</button>` : "";
    const c = document.getElementById("clearF");
    if (c) c.onclick = () => { state.q = ""; state.topic = ""; state.issue = ""; const qi = document.getElementById("q"); if (qi) qi.value = ""; syncTopics(); renderGrid(); };
  }

  function syncTopics() {
    document.querySelectorAll(".tchip").forEach(b => b.classList.toggle("on", b.dataset.topic === state.topic));
  }

  function bindHome() {
    document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });
    document.getElementById("searchBtn").addEventListener("click", () => {
      const row = document.getElementById("searchRow");
      row.hidden = !row.hidden; state.searchOpen = !row.hidden;
      if (!row.hidden) document.getElementById("q").focus();
    });
    document.querySelectorAll(".tchip").forEach(b => b.addEventListener("click", () => {
      state.topic = b.dataset.topic; syncTopics(); renderGrid();
    }));
    app.querySelectorAll("[data-jump]").forEach(a => a.addEventListener("click", e => {
      e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({ behavior: "smooth" });
    }));
  }

  /* 卡片點擊（委派） */
  app.addEventListener("click", e => {
    const card = e.target.closest(".tile");
    if (card && !e.target.closest("a")) location.hash = "#/s/" + card.dataset.id;
  });
  app.addEventListener("keydown", e => {
    const card = e.target.closest && e.target.closest(".tile");
    if (card && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); location.hash = "#/s/" + card.dataset.id; }
  });

  /* ---------- 文章內容區塊 ---------- */
  function block(b) {
    if (b.h) return `<h2>${md(b.h)}</h2>`;
    if (b.h3) return `<h3>${md(b.h3)}</h3>`;
    if (b.p) return `<p>${md(b.p)}</p>`;
    if (b.q) return `<blockquote>${md(b.q)}${b.by ? `<cite>（${esc(b.by)}）</cite>` : ""}</blockquote>`;
    if (b.list) return `<ul class="list">${b.list.map(x => `<li>${md(x)}</li>`).join("")}</ul>`;
    if (b.chips) return `<div class="chips">${b.chips.map(x => `<span>${esc(x)}</span>`).join("")}</div>`;
    if (b.stats) return `<div class="statrow">${b.stats.map(s => `<div><b>${esc(s.n)}</b><span>${esc(s.l)}</span></div>`).join("")}</div>`;
    if (b.cards) return `<div class="cards">${b.cards.map(c => `<div class="mini">${c.icon ? `<span class="ic">${c.icon}</span>` : ""}<b>${md(c.t)}</b><div>${md(c.d)}</div></div>`).join("")}</div>`;
    if (b.steps) return `<div class="steps">${b.steps.map(s => `<div class="step"><div><b>${md(s.t)}</b><div>${md(s.d)}</div></div></div>`).join("")}</div>`;
    if (b.timeline) return `<div class="tline">${b.timeline.map(s => `<div class="ti"><span class="y">${esc(s.y)}</span><b>${md(s.t)}</b><div>${md(s.d)}</div></div>`).join("")}</div>`;
    if (b.ladder) {
      const n = b.ladder.length;
      return `<div class="ladder">${b.ladder.map((r, i) => `<div class="rung"><div class="lv">${esc(r.t)}<small>${"●".repeat(i + 1)}${"○".repeat(n - i - 1)}　AI 介入</small></div><div class="dd">${md(r.d)}</div></div>`).join("")}</div>`;
    }
    if (b.compare) {
      const c = b.compare;
      return `<div class="tbl-wrap"><table class="cmp"><thead><tr>${c.cols.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${c.rows.map(r => `<tr>${r.map(x => `<td>${md(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
        ${c.notes ? `<div class="cmp-notes">${c.cols.map((h, i) => c.notes[i] ? `<div>${esc(h)}：${md(c.notes[i])}</div>` : "").join("")}</div>` : ""}`;
    }
    if (b.twoCol) {
      const col = (x, cls) => `<div class="col ${cls}"><b>${esc(x.t)}</b>${x.items.map(i => `<div class="it"><b>${md(i.t)}</b>${md(i.d)}</div>`).join("")}</div>`;
      return `<div class="two">${col(b.twoCol.left, "ok")}${col(b.twoCol.right, "no")}</div>`;
    }
    if (b.indicators) {
      const d = b.indicators;
      const count = d.groups.reduce((n, g) => n + g.clusters.reduce((m, c) => m + c.items.length, 0), 0);
      return `<details class="appx"><summary>${esc(d.title)}（${count} 項指標，點開展開）</summary><div class="inner">
        <p class="note">${md(d.note)}</p>
        ${d.groups.map(g => `<h4>${esc(g.face)}</h4>${g.clusters.map(c => `<h5>集群：${esc(c.name)}</h5>${c.items.map(it => `<div class="ind"><div>${esc(it[0])}</div><div>${md(it[1])}</div></div>`).join("")}`).join("")}`).join("")}
      </div></details>`;
    }
    if (b.related) {
      const r = ARTS.find(a => a.id === b.related);
      return r ? `<div class="related">🔗 延伸對照：<a href="#/a/${r.id}">${esc(r.title)}</a></div>` : "";
    }
    return "";
  }

  /* ---------- 文章頁 ---------- */
  function renderArticle(id) {
    const a = ARTS.find(x => x.id === id);
    if (!a) { renderHome(); return; }
    const idx = sorted.indexOf(a);
    const prev = sorted[idx - 1], next = sorted[idx + 1];
    document.title = a.title + "｜AI教育資訊快報";
    app.innerHTML = `<div class="article" style="--c:${color(a)}"><div class="wrap">
      <div class="crumb"><a href="#/">首頁</a>›<span>全文版</span>›<span>${esc(a.title)}</span></div>
      <div class="a-head">
        <span class="deco">${deco(a)}</span>
        <div class="top" style="display:flex;gap:8px;flex-wrap:wrap">${a.topics.map(k => `<a class="tag" style="--c:${T[k] ? T[k].color : ""}" href="#/topic/${k}">${T[k] ? T[k].emoji + " " + esc(T[k].name) : k}</a>`).join("")}</div>
        <h1>${esc(a.title)}</h1>
        <div class="meta"><span>📅 ${fmtDate(a._date)}</span>${a._issue ? `<span>📚 收錄於第 ${a.issue} 期快報</span>` : ""}${a.authors ? `<span>✍️ ${esc(a.authors)}</span>` : ""}</div>
      </div>

      <div class="quick">
        <div class="panel"><h2>⏱ 三十秒導讀</h2><ol>${a.tldr.map(t => `<li>${md(t)}</li>`).join("")}</ol></div>
        <div class="panel take2"><h2>🎓 給師培課程的一句話</h2><p>${md(a.takeaway)}</p>
          <div class="actions">
            <a class="btn primary" href="#/s/${a.id}">▶ 用翻頁模式看</a>
            ${a.fulltext ? `<a class="btn" href="${esc(a.fulltext.url)}" target="_blank" rel="noopener">${esc(a.fulltext.label)} ↗</a>` : ""}
            <button class="btn" type="button" id="copyLink">🔗 複製這則連結</button>
          </div>
        </div>
      </div>

      <div class="a-body">
        <span class="label">📖 完整內容</span>
        ${a.body.map(block).join("")}
        ${a.refs && a.refs.length ? `<details class="refs" ${a.refs.length <= 3 ? "open" : ""}><summary>資料來源（${a.refs.length} 筆）</summary><ol>${a.refs.map(r => `<li>${esc(r.t)}${r.url ? `<br><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(decodeURIComponentSafe(r.url))}</a>` : ""}</li>`).join("")}</ol></details>` : ""}
      </div>

      <div class="pager">
        ${prev ? `<a href="#/a/${prev.id}"><small>← 較新一則</small><b>${esc(prev.title)}</b></a>` : "<span></span>"}
        ${next ? `<a class="nx" href="#/a/${next.id}"><small>較早一則 →</small><b>${esc(next.title)}</b></a>` : ""}
      </div>
    </div></div>`;
    document.getElementById("copyLink").onclick = () => {
      const url = location.href;
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast("已複製連結，可以貼給同事"), () => toast(url));
    };
    window.scrollTo(0, 0);
  }
  function decodeURIComponentSafe(u) { try { return decodeURI(u); } catch (e) { return u; } }

  /* ---------- 路由 ---------- */
  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    const [kind, val, pg] = h.split("/");
    if (kind === "s" && R && R.openArticle(decodeURIComponent(val), +pg || 1)) { if (!app.innerHTML) renderHome(); return; }
    if (kind === "i" && R && R.openIssue(val, +pg || 1)) { if (!app.innerHTML) renderHome(); return; }
    if (R) R.close();
    READ = R ? R.readSet() : new Set();
    if (kind !== "a") document.title = "AI教育資訊快報";
    if (kind === "a" && val) return renderArticle(decodeURIComponent(val));
    if (kind === "topic") { state.topic = val || ""; state.issue = ""; state.q = ""; return renderHome("all"); }
    if (kind === "issue") { state.issue = val || ""; state.topic = ""; state.q = ""; return renderHome("all"); }
    renderHome(route._jump || null); route._jump = null;
  }
  window.addEventListener("hashchange", route);
  document.querySelectorAll("[data-jump]").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const target = a.dataset.jump;
    if (location.hash === "" || location.hash === "#/" || location.hash === "#") {
      if (document.getElementById(target)) document.getElementById(target).scrollIntoView({ behavior: "smooth" });
      else { route._jump = target; route(); }
    } else { route._jump = target; location.hash = "#/"; }
  }));

  /* ---------- 深淺色 ---------- */
  const root = document.documentElement;
  const saved = store.get("kb-theme");
  if (saved) root.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").addEventListener("click", () => {
    const dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const nt = dark ? "light" : "dark";
    root.setAttribute("data-theme", nt); store.set("kb-theme", nt);
  });

  const totop = document.getElementById("totop");
  window.addEventListener("scroll", () => totop.classList.toggle("show", window.scrollY > 600), { passive: true });
  totop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

  route();
})();
</script>
</body>
</html>
